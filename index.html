<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park Ustası 3D</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    background:#000;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    background:rgba(0,0,0,.7);
    padding:12px;
    border-radius:10px;
    z-index:100;
}

#mission{
    margin-top:8px;
    color:#7cff7c;
}
</style>
</head>

<body>

<div id="ui">
    <div>💰 Para: <span id="money">0</span> ₺</div>
    <div id="mission">Görev: Sarı alana park et</div>
</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(50,100,50);
scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff,1));

const ground = new THREE.Mesh(
new THREE.PlaneGeometry(400,400),
new THREE.MeshLambertMaterial({color:0x75c66e})
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* yollar */

function road(x,z,w,h){

const r=new THREE.Mesh(
new THREE.BoxGeometry(w,0.1,h),
new THREE.MeshLambertMaterial({color:0x2f2f2f})
);

r.position.set(x,0.05,z);
scene.add(r);

}

road(0,0,250,20);
road(0,0,20,250);
road(80,80,120,20);
road(-80,-80,120,20);

/* bina */

function building(x,z,w,h,d,color){

const b=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshLambertMaterial({color})
);

b.position.set(x,h/2,z);

scene.add(b);

}

building(60,40,25,30,25,0x88aaff);
building(-60,30,20,20,20,0xffaaaa);
building(70,-50,40,18,35,0xaaffaa);
building(-80,-60,35,25,25,0xffffaa);

/* avm */

building(110,90,60,15,40,0xdedede);

/* hastane */

building(-120,95,50,20,30,0xffffff);

/* benzinlik */

building(115,-90,25,8,25,0xff4444);

/* oyuncu */

const car = new THREE.Mesh(
new THREE.BoxGeometry(4,2,8),
new THREE.MeshStandardMaterial({
color:0x0066ff
})
);

car.position.y=1.3;

scene.add(car);

let speed=0;
let angle=0;

const keys={};

window.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

/* park alanı */

const parkZone=new THREE.Mesh(
new THREE.BoxGeometry(12,0.2,12),
new THREE.MeshBasicMaterial({
color:0xffff00
})
);

parkZone.position.set(80,0.12,80);

scene.add(parkZone);

let money=0;
let complete=false;

function animate(){

requestAnimationFrame(animate);

if(keys["w"]) speed+=0.003;
if(keys["s"]) speed-=0.003;

speed*=0.98;

if(keys["a"]) angle+=0.03;
if(keys["d"]) angle-=0.03;

car.rotation.y=angle;

car.position.x += Math.sin(angle)*speed*60;
car.position.z += Math.cos(angle)*speed*60;

camera.position.x=
car.position.x
-
Math.sin(angle)*18;

camera.position.z=
car.position.z
-
Math.cos(angle)*18;

camera.position.y=10;

camera.lookAt(car.position);

const dx=
car.position.x-
parkZone.position.x;

const dz=
car.position.z-
parkZone.position.z;

const dist=
Math.sqrt(dx*dx+dz*dz);

if(dist<5 && !complete){

complete=true;

money+=500;

document.getElementById(
"money"
).innerText=money;

document.getElementById(
"mission"
).innerText=
"✅ Görev tamamlandı (+500₺)";
}

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
